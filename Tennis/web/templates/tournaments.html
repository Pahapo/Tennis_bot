<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Турниры</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Список турниров</h1>
    
    {% if tournaments %}
    <table>
        <thead>
            <tr>
                <th>Название</th>
                <th>Дата начала</th>
                <th>Дата окончания</th>
            </tr>
        </thead>
        <tbody>
            {% for tournament in tournaments %}
            <tr>
                <td>{{ tournament.name_tournament }}</td>
                <td>{{ tournament.start_tournament }}</td>
                <td>{{ tournament.end_tournament }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>Нет активных турниров</p>
    {% endif %}
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
