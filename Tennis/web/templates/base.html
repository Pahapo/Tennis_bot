<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Pro - {% block title %}{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="court-lines"></div>
    <div class="container">
        <header class="header">
            <h1>Tennis Pro</h1>
            <div class="user-menu">
                {% if 'user_id' in session %}
                    <span>Привет, {{ session['user_name'] }}</span>
                    <a href="{{ url_for('profile') }}"><i class="fas fa-user"></i></a>
                    <a href="/logout"><i class="fas fa-sign-out-alt"></i></a>
                {% else %}
                    <a href="{{ url_for('login') }}">Войти</a>
                {% endif %}
            </div>
        </header>

        <nav class="sidebar">
            <ul>
                <li><a href="{{ url_for('home') }}"><i class="fas fa-home"></i> Главная</a></li>
                <li><a href="{{ url_for('tournaments') }}"><i class="fas fa-trophy"></i> Турниры</a></li>
                <li><a href="{{ url_for('booking') }}"><i class="fas fa-calendar-alt"></i> Бронирование</a></li>
                <li><a href="/matches"><i class="fas fa-users"></i> Поиск соперника</a></li>
                <li><a href="/inventory"><i class="fas fa-shopping-cart"></i> Барахолка</a></li>
            </ul>
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
