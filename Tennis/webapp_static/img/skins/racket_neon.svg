<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Ракетка «racket_neon» для карточки в магазине. На главном экране та же ракетка рисуется в CSS -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5f8f"/><stop offset=".45" stop-color="#1f2d4f"/><stop offset="1" stop-color="#0a1226"/></linearGradient>
    <pattern id="strings" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 .5H9M.5 0V9" stroke="#4fe3ff" stroke-width="1"/></pattern>
    <pattern id="grip" width="7" height="12" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)"><rect width="7" height="12" fill="#1a2238"/><rect x="5.5" width="1.5" height="12" fill="#4fe3ff"/></pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#4fe3ff" flood-opacity=".7"/></filter>
  </defs>
  <!-- Горло -->
  <g fill="none" stroke-linecap="round">
    <path d="M116 41Q132 50 148 55M116 79Q132 70 148 65" stroke="#050a18" stroke-width="9"/>
    <path d="M116 41Q132 50 148 55M116 79Q132 70 148 65" stroke="url(#rim)" stroke-width="4.5"/>
  </g>
  <!-- Рукоятка: переход, кольцо, обмотка, торец -->
  <rect x="146" y="53.5" width="48" height="13" rx="4" fill="#050a18"/>
  <rect x="148" y="55.5" width="44" height="9" rx="2.5" fill="url(#grip)"/>
  <rect x="148" y="55.5" width="7" height="9" fill="#1f2d4f"/>
  <rect x="155" y="55.5" width="3.5" height="9" fill="#4fe3ff"/>
  <rect x="187" y="55.5" width="5" height="9" rx="2" fill="#4fe3ff"/>
  <rect x="148" y="55.5" width="44" height="3" fill="#ffffff" opacity=".25"/>
  <!-- Голова: струны, обод, блик, отверстия для струн -->
  <ellipse cx="64" cy="60" rx="50" ry="42" fill="#14213d"/>
  <ellipse cx="64" cy="60" rx="50" ry="42" fill="url(#strings)" opacity=".3"/>
  <g filter="url(#glow)">
    <ellipse cx="64" cy="60" rx="54" ry="46" fill="none" stroke="#050a18" stroke-width="10"/>
    <ellipse cx="64" cy="60" rx="54" ry="46" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>
  <ellipse cx="64" cy="60" rx="54" ry="46" fill="none" stroke="#4fe3ff" stroke-width="1.8" stroke-linecap="round" pathLength="100" stroke-dasharray="16 84" stroke-dashoffset="-56" opacity=".9"/>
  <ellipse cx="64" cy="60" rx="54" ry="46" fill="none" stroke="#4fe3ff" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="0 2.5"/>
</svg>
