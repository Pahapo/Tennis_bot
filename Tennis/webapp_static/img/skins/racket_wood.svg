<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Ракетка «racket_wood» для карточки в магазине. На главном экране та же ракетка рисуется в CSS -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c48a"/><stop offset=".45" stop-color="#c58a4a"/><stop offset="1" stop-color="#7a4a1d"/></linearGradient>
    <pattern id="strings" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 .5H9M.5 0V9" stroke="#f3e3c0" stroke-width="1"/></pattern>
    <pattern id="grip" width="7" height="12" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)"><rect width="7" height="12" fill="#8a4a1c"/><rect x="5.5" width="1.5" height="12" fill="#4a2208"/></pattern>
  </defs>
  <!-- Горло -->
  <g fill="none" stroke-linecap="round">
    <path d="M116 41Q132 50 148 55M116 79Q132 70 148 65" stroke="#3d1f00" stroke-width="9"/>
    <path d="M116 41Q132 50 148 55M116 79Q132 70 148 65" stroke="url(#rim)" stroke-width="4.5"/>
  </g>
  <!-- Рукоятка: переход, кольцо, кожаная обмотка, торец -->
  <rect x="146" y="53.5" width="48" height="13" rx="4" fill="#3d1f00"/>
  <rect x="148" y="55.5" width="44" height="9" rx="2.5" fill="url(#grip)"/>
  <rect x="148" y="55.5" width="7" height="9" fill="#c58a4a"/>
  <rect x="155" y="55.5" width="3.5" height="9" fill="#f3e3c0"/>
  <rect x="187" y="55.5" width="5" height="9" rx="2" fill="#5a2d0a"/>
  <rect x="148" y="55.5" width="44" height="3" fill="#ffffff" opacity=".25"/>
  <!-- Голова: струны, обод, волокна дерева, блик, отверстия для струн -->
  <ellipse cx="64" cy="60" rx="50" ry="42" fill="#14213d"/>
  <ellipse cx="64" cy="60" rx="50" ry="42" fill="url(#strings)" opacity=".4"/>
  <ellipse cx="64" cy="60" rx="54" ry="46" fill="none" stroke="#3d1f00" stroke-width="10"/>
  <ellipse cx="64" cy="60" rx="54" ry="46" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <ellipse cx="64" cy="60" rx="52.3" ry="44.3" fill="none" stroke="#5a2d0a" stroke-opacity=".75" stroke-width="1.1" stroke-linecap="round" pathLength="100" stroke-dasharray="7 1.5 3 1 11 2 5 1.5"/>
  <ellipse cx="64" cy="60" rx="55.7" ry="47.7" fill="none" stroke="#5a2d0a" stroke-opacity=".75" stroke-width="0.9" stroke-linecap="round" pathLength="100" stroke-dasharray="4 2 9 1.5 6 2.5"/>
  <ellipse cx="64" cy="60" rx="54" ry="46" fill="none" stroke="#fff0d2" stroke-width="1.8" stroke-linecap="round" pathLength="100" stroke-dasharray="16 84" stroke-dashoffset="-56" opacity=".85"/>
  <ellipse cx="64" cy="60" rx="54" ry="46" fill="none" stroke="#f3e3c0" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="0 2.5"/>
</svg>
